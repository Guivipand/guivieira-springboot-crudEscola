<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Professor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-graduation-cap"></i> <span>Acadêmico</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/listarProfessores">Professores</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        <div class="container-main">
            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/">Dashboard</a></li>
                    <li class="breadcrumb-item"><a href="/listarProfessores">Professores</a></li>
                    <li class="breadcrumb-item active">Detalhes</li>
                </ol>
            </nav>

            <!-- Details Card -->
            <div class="card fade-in" style="max-width: 600px; margin: 0 auto;">
                <div class="card-header">
                    <h4 class="mb-0">
                        <i class="fas fa-chalkboard-user"></i> Detalhes do Professor
                    </h4>
                </div>
                <div class="card-body">
                    <!-- ID -->
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <p class="text-muted mb-2">ID</p>
                            <h6 th:text="${professor.id}"></h6>
                        </div>
                        <div class="col-md-6">
                            <p class="text-muted mb-2">Status</p>
                            <span class="badge badge-success">Ativo</span>
                        </div>
                    </div>

                    <!-- Nome -->
                    <div class="mb-4">
                        <p class="text-muted mb-2">
                            <i class="fas fa-user"></i> Nome
                        </p>
                        <h5 th:text="${professor.nome}"></h5>
                    </div>

                    <!-- Email -->
                    <div class="mb-4">
                        <p class="text-muted mb-2">
                            <i class="fas fa-envelope"></i> Email
                        </p>
                        <h6>
                            <a th:href="@{'mailto:' + ${professor.email}}" th:text="${professor.email}"></a>
                        </h6>
                    </div>

                    <!-- Departamento e Titulação -->
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <p class="text-muted mb-2">
                                <i class="fas fa-building"></i> Departamento
                            </p>
                            <h6 th:text="${professor.departamento}"></h6>
                        </div>
                        <div class="col-md-6">
                            <p class="text-muted mb-2">
                                <i class="fas fa-graduation-cap"></i> Titulação
                            </p>
                            <span class="badge badge-info" th:text="${professor.titulacao}"></span>
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="card-footer bg-light d-flex gap-2 justify-content-between">
                    <div>
                        <a th:href="@{/formularioProfessor/{id}(id=${professor.id})}" class="btn btn-warning btn-sm">
                            <i class="fas fa-edit"></i> Editar
                        </a>
                        <a th:href="@{/deletarProfessor/{id}(id=${professor.id})}" 
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Tem certeza que deseja deletar?')">
                            <i class="fas fa-trash"></i> Deletar
                        </a>
                    </div>
                    <a href="/listarProfessores" class="btn btn-secondary btn-sm">
                        <i class="fas fa-arrow-left"></i> Voltar
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container-fluid">
            <p>&copy; 2024 Sistema Acadêmico. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
