<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Curso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-graduation-cap"></i> <span>Acadêmico</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/listarCursos">Cursos</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        <div class="container-main">
            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/">Dashboard</a></li>
                    <li class="breadcrumb-item"><a href="/listarCursos">Cursos</a></li>
                    <li class="breadcrumb-item active"
                        th:text="${curso != null and curso.id != null} ? 'Editar' : 'Novo Curso'"></li>
                </ol>
            </nav>

            <!-- Form Card -->
            <div class="card fade-in" style="max-width: 600px; margin: 0 auto;">
                <div class="card-header">
                    <h4 class="mb-0">
                        <i class="fas fa-plus-circle"></i>
                        <span
                            th:text="${curso != null and curso.id != null} ? 'Editar Curso' : 'Cadastrar Novo Curso'"></span>
                    </h4>
                </div>
                <div class="card-body">
                    <form th:method="post"
                        th:action="${curso != null and curso.id != null} ? @{/curso/{id}/atualizar(id=${curso.id})} : @{/cadastrarCurso}">

                        <!-- Título -->
                        <div class="form-group">
                            <label for="titulo" class="form-label">
                                <span class="required">Título do Curso</span>
                            </label>
                            <input type="text" class="form-control" id="titulo" name="titulo"
                                th:value="${curso != null} ? ${curso.titulo} : ''"
                                placeholder="Digite o título do curso" required>
                        </div>

                        <!-- Descrição -->
                        <div class="form-group">
                            <label for="descricao" class="form-label">Descrição</label>
                            <textarea class="form-control" id="descricao" name="descricao" rows="4"
                                placeholder="Digite a descrição do curso"
                                th:text="${curso != null} ? ${curso.descricao} : ''"></textarea>
                        </div>

                        <!-- Quantidade de Semestres -->
                        <div class="form-group">
                            <label for="quantSemestres" class="form-label">
                                <span class="required">Quantidade de Semestres</span>
                            </label>
                            <input type="number" class="form-control" id="quantSemestres" name="quantSemestres"
                                th:value="${curso != null} ? ${curso.quantSemestres} : ''"
                                placeholder="Digite a quantidade de semestres" min="1" required>
                            <small class="form-text">Digite um número entre 1 e 12</small>
                        </div>

                        <!-- Coordenador -->
                        <div class="form-group">
                            <label for="coordenador" class="form-label">
                                <span class="required">Coordenador</span>
                            </label>
                            <input type="text" class="form-control" id="coordenador" name="coordenador"
                                th:value="${curso != null} ? ${curso.coordenador} : ''"
                                placeholder="Digite o nome do coordenador" required>
                        </div>

                        <!-- Actions -->
                        <div class="d-grid gap-2 d-sm-flex justify-content-sm-between mt-4">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="fas fa-save"></i> Salvar
                            </button>
                            <a href="/listarCursos" class="btn btn-secondary btn-lg">
                                <i class="fas fa-arrow-left"></i> Voltar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container-fluid">
            <p>&copy; 2026 Sistema Acadêmico. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
