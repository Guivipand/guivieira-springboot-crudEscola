<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Matrícula</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-graduation-cap"></i> <span>Acadêmico</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/listarMatriculas">Matrículas</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        <div class="container-main">
            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/">Dashboard</a></li>
                    <li class="breadcrumb-item"><a href="/listarMatriculas">Matrículas</a></li>
                    <li class="breadcrumb-item active" 
                        th:text="${matricula != null and matricula.id != null} ? 'Editar' : 'Nova Matrícula'"></li>
                </ol>
            </nav>

            <!-- Form Card -->
            <div class="card fade-in" style="max-width: 600px; margin: 0 auto;">
                <div class="card-header">
                    <h4 class="mb-0">
                        <i class="fas fa-clipboard-list"></i> 
                        <span th:text="${matricula != null and matricula.id != null} ? 'Editar Matrícula' : 'Cadastrar Nova Matrícula'"></span>
                    </h4>
                </div>
                <div class="card-body">
                    <form th:method="post"
                          th:action="${matricula != null and matricula.id != null} ? @{/atualizarMatricula/{id}(id=${matricula.id})} : @{/cadastrarMatricula}">
                        
                        <!-- Aluno -->
                        <div class="form-group">
                            <label for="alunoId" class="form-label">
                                <span class="required">Aluno</span>
                            </label>
                            <select class="form-select" id="alunoId" name="alunoId" required>
                                <option value="">-- Selecionar aluno --</option>
                                <option th:each="aluno : ${alunos}"
                                        th:value="${aluno.id}"
                                        th:text="${aluno.nome}"
                                        th:selected="${matricula != null and matricula.aluno != null and matricula.aluno.id == aluno.id}"></option>
                            </select>
                        </div>

                        <!-- Curso -->
                        <div class="form-group">
                            <label for="cursoId" class="form-label">
                                <span class="required">Curso</span>
                            </label>
                            <select class="form-select" id="cursoId" name="cursoId" required>
                                <option value="">-- Selecionar curso --</option>
                                <option th:each="curso : ${cursos}"
                                        th:value="${curso.id}"
                                        th:text="${curso.titulo}"
                                        th:selected="${matricula != null and matricula.curso != null and matricula.curso.id == curso.id}"></option>
                            </select>
                        </div>

                        <!-- Oferta de Disciplina -->
                        <div class="form-group">
                            <label for="ofertaDisciplinaId" class="form-label">
                                <span class="required">Oferta de Disciplina</span>
                            </label>
                            <select class="form-select" id="ofertaDisciplinaId" name="ofertaDisciplinaId" required>
                                <option value="">-- Selecionar oferta --</option>
                                <option th:each="oferta : ${ofertas}"
                                        th:value="${oferta.id}"
                                        th:text="${oferta.disciplina != null} ? ${oferta.disciplina.nome} + ' - ' + ${oferta.professor.nome} : 'Oferta indefinida'"
                                        th:selected="${matricula != null and matricula.ofertaDisciplina != null and matricula.ofertaDisciplina.id == oferta.id}"></option>
                            </select>
                        </div>

                        <!-- Datas -->
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="dataInicio" class="form-label">
                                        <span class="required">Data de Início</span>
                                    </label>
                                    <input type="date" class="form-control" id="dataInicio" name="dataInicio" 
                                           th:value="${matricula != null} ? ${matricula.dataInicio} : ''" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="dataFim" class="form-label">
                                        <span class="required">Data de Fim</span>
                                    </label>
                                    <input type="date" class="form-control" id="dataFim" name="dataFim" 
                                           th:value="${matricula != null} ? ${matricula.dataFim} : ''" required>
                                </div>
                            </div>
                        </div>

                        <!-- Situação -->
                        <div class="form-group">
                            <label for="situacao" class="form-label">
                                <span class="required">Situação</span>
                            </label>
                            <select class="form-select" id="situacao" name="situacao" required>
                                <option value="">-- Selecionar situação --</option>
                                <option value="Ativa" th:selected="${matricula != null and matricula.situacao == 'Ativa'}">Ativa</option>
                                <option value="Concluída" th:selected="${matricula != null and matricula.situacao == 'Concluída'}">Concluída</option>
                                <option value="Cancelada" th:selected="${matricula != null and matricula.situacao == 'Cancelada'}">Cancelada</option>
                            </select>
                        </div>

                        <!-- Actions -->
                        <div class="d-grid gap-2 d-sm-flex justify-content-sm-between mt-4">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="fas fa-save"></i> Salvar
                            </button>
                            <a href="/listarMatriculas" class="btn btn-secondary btn-lg">
                                <i class="fas fa-arrow-left"></i> Voltar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container-fluid">
            <p>&copy; 2024 Sistema Acadêmico. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
