<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-graduation-cap"></i> <span>Acadêmico</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/listarAlunos">Alunos</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        <div class="container-main">
            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/">Dashboard</a></li>
                    <li class="breadcrumb-item"><a href="/listarAlunos">Alunos</a></li>
                    <li class="breadcrumb-item active" 
                        th:text="${aluno != null and aluno.id != null} ? 'Editar' : 'Novo Aluno'"></li>
                </ol>
            </nav>

            <!-- Form Card -->
            <div class="card fade-in" style="max-width: 600px; margin: 0 auto;">
                <div class="card-header">
                    <h4 class="mb-0">
                        <i class="fas fa-user-plus"></i> 
                        <span th:text="${aluno != null and aluno.id != null} ? 'Editar Aluno' : 'Cadastrar Novo Aluno'"></span>
                    </h4>
                </div>
                <div class="card-body">
                    <form th:method="post"
                          th:action="${aluno != null and aluno.id != null} ? @{/atualizarAluno/{id}(id=${aluno.id})} : @{/cadastrarAluno}">
                        
                        <!-- Nome -->
                        <div class="form-group">
                            <label for="nome" class="form-label">
                                <span class="required">Nome</span>
                            </label>
                            <input type="text" class="form-control" id="nome" name="nome" 
                                   th:value="${aluno != null} ? ${aluno.nome} : ''"
                                   placeholder="Digite o nome completo do aluno" required>
                            <small class="form-text">Digite o nome completo do aluno</small>
                        </div>

                        <!-- Email -->
                        <div class="form-group">
                            <label for="email" class="form-label">
                                <span class="required">Email</span>
                            </label>
                            <input type="email" class="form-control" id="email" name="email" 
                                   th:value="${aluno != null} ? ${aluno.email} : ''"
                                   placeholder="Digite o email do aluno" required>
                            <small class="form-text">Digite um email válido</small>
                        </div>

                        <!-- Data de Ingresso -->
                        <div class="form-group">
                            <label for="dataIngresso" class="form-label">
                                <span class="required">Data de Ingresso</span>
                            </label>
                            <input type="date" class="form-control" id="dataIngresso" name="dataIngresso" 
                                   th:value="${aluno != null} ? ${aluno.dataIngresso} : ''"
                                   required>
                            <small class="form-text">Selecione a data de ingresso do aluno</small>
                        </div>

                        <!-- Curso -->
                        <div class="form-group">
                            <label for="cursoId" class="form-label">
                                <span class="required">Curso</span>
                            </label>
                            <select class="form-select" id="cursoId" name="cursoId" required>
                                <option value="">-- Selecionar curso --</option>
                                <option th:each="curso : ${cursos}"
                                        th:value="${curso.id}"
                                        th:text="${curso.titulo} + ' (' + ${curso.quantSemestres} + ' semestres)'"
                                        th:selected="${aluno != null and aluno.curso != null and aluno.curso.id == curso.id}">
                                </option>
                            </select>
                            <small class="form-text">Selecione o curso do aluno</small>
                        </div>

                        <!-- Actions -->
                        <div class="d-grid gap-2 d-sm-flex justify-content-sm-between mt-4">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="fas fa-save"></i> Salvar
                            </button>
                            <a href="/listarAlunos" class="btn btn-secondary btn-lg">
                                <i class="fas fa-arrow-left"></i> Voltar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container-fluid">
            <p>&copy; 2024 Sistema Acadêmico. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
